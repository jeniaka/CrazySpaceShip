<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ================= UTILS =================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let HI=0; try{HI=+localStorage.getItem('inv78hi')||0}catch(e){}
let GOD=false;
const pad=(n,l=6)=>String(Math.floor(n)).padStart(l,'0');

// ================= INPUT =================
const keys={};
const inp={x:0,y:0,fire:false,nova:false,anyPressed:false};
const ptr={down:false,id:null,lx:0,ly:0,dx:0,dy:0,taps:0,lastTap:0};
let onAnyKey=null;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]){ keys[e.code]=true; if(onAnyKey) onAnyKey(e); }
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false; ptr.down=false;});
addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  initAudio();
  if(!ptr.down){ ptr.down=true; ptr.id=e.pointerId; ptr.lx=e.clientX; ptr.ly=e.clientY; }
  const now=performance.now();
  if(now-ptr.lastTap<300) ptr.taps++; else ptr.taps=1;
  ptr.lastTap=now;
  if(onAnyKey) onAnyKey({code:'Pointer',key:'',pointer:true});
},{passive:true});
addEventListener('pointermove',e=>{
  if(!ptr.down||e.pointerId!==ptr.id) return;
  ptr.dx+=e.clientX-ptr.lx; ptr.dy+=e.clientY-ptr.ly; ptr.lx=e.clientX; ptr.ly=e.clientY;
},{passive:true});
const ptrUp=e=>{ if(e.pointerId===ptr.id){ptr.down=false;ptr.id=null;} };
addEventListener('pointerup',ptrUp); addEventListener('pointercancel',ptrUp);
function readInput(){
  inp.x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  inp.y=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0);
  inp.fire=!!(keys.Space||keys.KeyJ||keys.KeyZ||ptr.down);
  inp.nova=!!(keys.ShiftLeft||keys.ShiftRight||keys.KeyE||keys.KeyX);
  // pointer drag deltas, consumed per frame (px)
  inp.pdx=ptr.dx; inp.pdy=ptr.dy; ptr.dx=0; ptr.dy=0;
}

// ================= AUDIO =================
let AC=null,master,sfxG,musG,noiseBuf,muted=false,comp;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(AC.destination);
  master=AC.createGain(); master.gain.value=muted?0:.7; master.connect(comp);
  sfxG=AC.createGain(); sfxG.gain.value=.8; sfxG.connect(master);
  musG=AC.createGain(); musG.gain.value=.5; musG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  music.next=AC.currentTime+.1;
}
function setMute(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:.7,AC.currentTime,.02); $('mute').textContent='M · SOUND '+(m?'OFF':'ON'); }
function tone(o){
  if(!AC) return; const t=o.t??AC.currentTime, d=o.d??.1;
  const os=AC.createOscillator(), g=AC.createGain();
  os.type=o.type||'square'; os.frequency.setValueAtTime(o.f||440,t);
  if(o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.sweep??d));
  if(o.det) os.detune.value=o.det;
  const v=o.v??.15; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a??.005));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  let node=os;
  if(o.lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; f.Q.value=o.q??1; os.connect(f); node=f; }
  node.connect(g); g.connect(o.dest||sfxG); os.start(t); os.stop(t+d+.05);
  return os;
}
function noise(o){
  if(!AC) return; const t=o.t??AC.currentTime, d=o.d??.2;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=o.ft||'lowpass'; f.frequency.setValueAtTime(o.f||2000,t); f.Q.value=o.q??1;
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);
  const g=AC.createGain(); const v=o.v??.2;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a??.004)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f); f.connect(g); g.connect(o.dest||sfxG); s.start(t,Math.random()); s.stop(t+d+.05);
}
const SFX={
  shot1(){ tone({f:1600,f2:300,d:.09,v:.07,type:'square'}); },
  invDie1(){ noise({f:3000,f2:300,d:.18,v:.2}); tone({f:520,f2:90,d:.16,v:.07}); },
  march(i){ const F=[98,87.3,77.8,73.4]; tone({f:F[i%4],d:.11,v:.24,type:'square',lp:420}); tone({f:F[i%4]/2,d:.11,v:.18,type:'triangle'}); },
  pDie1(){ noise({f:1800,f2:80,d:1.1,v:.32}); tone({f:300,f2:40,d:1,v:.1,type:'sawtooth',lp:900}); },
  ufoHit(){ for(let i=0;i<8;i++) tone({f:900-i*90,d:.06,v:.08,t:AC&&AC.currentTime+i*.05}); },
  laser(){ tone({f:1800,f2:220,d:.12,v:.05,type:'sawtooth',lp:4000}); tone({f:900,f2:120,d:.1,v:.04,type:'square',det:12}); },
  pew(){ tone({f:2400,f2:500,d:.07,v:.035,type:'square',lp:5000}); },
  boom(big){ noise({f:big?2400:3600,f2:60,d:big?1.4:.45,v:big?.5:.28}); tone({f:big?140:180,f2:30,d:big?.9:.3,v:big?.45:.25,type:'sine'}); },
  hit(){ noise({f:5000,f2:800,d:.06,v:.12,ft:'bandpass',q:2}); tone({f:200,f2:80,d:.05,v:.06}); },
  hurt(){ noise({f:900,f2:60,d:.5,v:.4}); tone({f:220,f2:40,d:.45,v:.3,type:'sawtooth',lp:1200}); },
  power(){ const t=AC?AC.currentTime:0; [523,659,784,1046,1318].forEach((f,i)=>tone({f,d:.12,v:.08,t:t+i*.06,type:'square',lp:3000})); },
  ring(){ const t=AC?AC.currentTime:0; [880,1320,1760].forEach((f,i)=>tone({f,d:.25,v:.06,t:t+i*.05,type:'triangle'})); },
  nova(){ noise({f:8000,f2:40,d:2.2,v:.55}); tone({f:60,f2:20,d:2,v:.6,type:'sine'}); tone({f:1200,f2:30,d:1.6,v:.12,type:'sawtooth',lp:3000}); },
  glitch(){ for(let i=0;i<6;i++) tone({f:rand(80,2000),d:.04,v:.08,t:AC&&AC.currentTime+i*.035,type:'square'}); },
  morph(){ tone({f:60,f2:900,d:1.6,v:.15,type:'sawtooth',lp:2400,sweep:1.6}); noise({f:200,f2:6000,d:1.6,v:.12,ft:'bandpass',q:4}); },
  warn(){ const t=AC?AC.currentTime:0; for(let i=0;i<3;i++){ tone({f:440,f2:880,d:.45,v:.12,t:t+i*.6,type:'sawtooth',lp:2000,sweep:.45}); } },
  beam(){ tone({f:80,f2:60,d:.8,v:.25,type:'sawtooth',lp:900}); noise({f:3000,d:.8,v:.15,ft:'bandpass',q:3}); },
  charge(){ tone({f:200,f2:1400,d:.9,v:.07,type:'square',lp:2500,sweep:.9}); },
};
let ufoOsc=null;
function ufoSound(on){
  if(!AC) return;
  if(on&&!ufoOsc){ const o=AC.createOscillator(), l=AC.createOscillator(), lg=AC.createGain(), g=AC.createGain();
    o.type='square'; o.frequency.value=500; l.frequency.value=7; lg.gain.value=200; l.connect(lg); lg.connect(o.frequency);
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500;
    g.gain.value=.04; o.connect(f); f.connect(g); g.connect(sfxG); o.start(); l.start(); ufoOsc={o,l,g}; }
  if(!on&&ufoOsc){ ufoOsc.g.gain.setTargetAtTime(0,AC.currentTime,.02); const u=ufoOsc; setTimeout(()=>{try{u.o.stop();u.l.stop()}catch(e){}},200); ufoOsc=null; }
}

// ================= MUSIC (procedural) =================
const music={track:null,step:0,next:0,beat:0,onBeat:null};
const N=n=>440*Math.pow(2,(n-69)/12);
function kick(t,v=.5){ tone({f:150,f2:38,d:.22,v,type:'sine',t,dest:musG,sweep:.12}); }
function snare(t,v=.2){ noise({f:1900,d:.16,v,ft:'bandpass',q:.8,t,dest:musG}); tone({f:190,f2:120,d:.08,v:v*.5,type:'triangle',t,dest:musG}); }
function hat(t,v=.05,d=.03){ noise({f:8000,d,v,ft:'highpass',t,dest:musG}); }
const MOTIF=[45,43,41,40]; // A G F E — the descending march
const TRACKS={
  synth:{bpm:112,play(s,t,spb){
    const b=s%16, bar=Math.floor(s/16);
    if(b%8===0) kick(t,.5); if(b===4||b===12) snare(t,.18); if(b%2===1) hat(t,.04);
    const root=MOTIF[Math.floor(b/4)];
    tone({f:N(root-12+(b%2?12:0)),d:spb*.9,v:.11,type:'sawtooth',lp:600+300*Math.sin(s*.2),t,dest:musG});
    if(bar%2===1){ const arp=[0,3,7,12,7,3]; tone({f:N(root+12+arp[b%6]),d:spb*.8,v:.035,type:'square',lp:2600,t,dest:musG}); }
    if(b%4===0) music.beat++;
  }},
  hyper:{bpm:140,play(s,t,spb){
    const b=s%16, bar=Math.floor(s/16)%4;
    if(b%4===0) kick(t,.55); if(b===4||b===12) snare(t,.2); if(b%4===2) hat(t,.07,.08); else hat(t,.025);
    const prog=[45,41,48,43][bar];
    tone({f:N(prog-12+(b%2?12:0)),d:spb*.85,v:.12,type:'sawtooth',lp:900,q:4,t,dest:musG});
    const arp=[0,7,12,15,19,15,12,7];
    tone({f:N(prog+12+arp[s%8]),d:spb*.7,v:.04,type:'square',lp:3500,t,dest:musG});
    if(b%4===0) music.beat++;
  }},
  boss:{bpm:152,play(s,t,spb){
    const b=s%16, bar=Math.floor(s/16)%4;
    if(b%4===0||b===14) kick(t,.6); if(b===4||b===12) snare(t,.24); if(b%2===1) hat(t,.04);
    const root=MOTIF[(Math.floor(s/4))%4]-12;
    tone({f:N(root),d:spb*.95,v:.13,type:'sawtooth',lp:500+400*((s%4)/4),q:6,t,dest:musG});
    tone({f:N(root)*1.01,d:spb*.95,v:.07,type:'square',lp:700,t,dest:musG});
    if(bar>=2 && b%2===0) tone({f:N(root+36+[0,3,7,10][b/2%4]),d:spb*1.6,v:.03,type:'sawtooth',lp:3000,t,dest:musG});
    if(b%4===0) music.beat++;
  }},
  win:{bpm:120,play(s,t,spb){
    const b=s%16, bar=Math.floor(s/16)%4;
    if(b%8===0) kick(t,.4); if(b===4||b===12) snare(t,.14); if(b%2) hat(t,.03);
    const prog=[48,55,57,53][bar]; const arp=[0,4,7,12,16,12,7,4];
    tone({f:N(prog+12+arp[s%8]),d:spb*.9,v:.05,type:'triangle',t,dest:musG});
    if(b%4===0) tone({f:N(prog-12),d:spb*3.5,v:.12,type:'sawtooth',lp:800,t,dest:musG});
  }},
};
function setTrack(n){ music.track=n; music.step=0; if(AC) music.next=AC.currentTime+.06; }
function musicTick(){
  if(!AC||!music.track) return;
  const T=TRACKS[music.track]; const spb=60/T.bpm/4;
  if(music.next<AC.currentTime-.2) music.next=AC.currentTime+.02;
  while(music.next<AC.currentTime+.12){ T.play(music.step,music.next,spb); music.next+=spb; music.step++; }
}

function shieldBitmap(){
  const W=22,H=16,b=new Uint8Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let on=true;
    if(y<4){ const cut=4-y; if(x<cut||x>=W-cut) on=false; }
    if(y>=10){ const half=3+(y-10)*.75; if(Math.abs(x-10.5)<half) on=false; }
    b[y*W+x]=on?1:0;
  }
  return b;
}

function shieldAt(px,py){
  for(const s of P1.shields){
    const lx=Math.floor(px-s.x), ly=Math.floor(py-s.y);

  }

}
function erode(s,cx,cy,pat){
  const p=SPR[pat], ox=Math.floor(cx-s.x-p[0].length/2), oy=Math.floor(cy-s.y-p.length/2);
  const out=[];
  p.forEach((row,y)=>{for(let x=0;x<row.length;x++){ if(row[x]!=='X'&&Math.random()>.2) continue; const lx=ox+x, ly=oy+y; if(lx>=0&&lx<22&&ly>=0&&ly<16&&s.b[ly*22+lx]){ s.b[ly*22+lx]=0; out.push([s.x+lx,s.y+ly]); } }});
  s.dirty=true; return out;
}

function p1KillPlayer(){
  if(GOD&&P1.lives>0&&!P1.storm) return;
  const pl=P1.pl; if(!pl.alive) return; pl.alive=false; pl.dead=P1.storm?70:110; P1.lives--; if(P1.storm) P1.lives=0; else P1.bombs.length=0; SFX.pDie1();
}
function p1Tick(){
  P1.tick++;
  const pl=P1.pl;
  if(P1.state==='over'){ P1.overT++; return; }
  if(P1.state==='stormdead'){ P1.overT++; P1.booms=P1.booms.filter(b=>--b.t>0); if(P1.overT>80){ P1.state='clear'; } return; }
  if(P1.state!=='play') return;
  P1.t+=1/60;
  if(!P1.storm&&P1.t>=P1_LIMIT) p1StartStorm();
  if(P1.storm&&P1.tick%26===0) tone({f:500,f2:1100,d:.24,v:.06,type:'sawtooth',lp:2400,sweep:.24});
  // --- player ---
  if(!pl.alive){
    pl.dead--;
    if(pl.dead<=0){ if(P1.lives>0){ pl.alive=true; pl.x=16; } else { P1.state='stormdead'; P1.overT=0; ufoSound(false); return; } }
  }else{
    pl.x=clamp(pl.x+inp.x*1.15,8,203);
    if(inp.fire&&!P1.shot&&!P1.shotBoom){ P1.shot={x:pl.x+6,y:207}; P1.shots++; SFX.shot1(); }
  }
  // --- shot ---
  if(P1.shot){
    const s=P1.shot; let done=false;
    for(let k=0;k<4&&!done;k++){
      s.y-=1;
      for(const iv of P1.inv){ if(iv.alive&&s.x>=iv.x&&s.x<iv.x+iv.w&&s.y>=iv.y&&s.y<iv.y+8){
        iv.alive=false; P1.alive--; P1.kills++; addScore(TYPES[iv.t].pts); P1.booms.push({x:iv.x+Math.floor(iv.w/2)-6,y:iv.y,k:'boom',t:16}); P1.freeze=14; SFX.invDie1(); done=true; break; } }
      if(done) break;
      if(P1.ufo&&s.x>=P1.ufo.x&&s.x<P1.ufo.x+16&&s.y>=40&&s.y<47){
        const val=pick([50,100,100,150,300]); addScore(val); P1.ufoMsg={x:P1.ufo.x,v:val,t:70}; P1.ufo=null; ufoSound(false); SFX.ufoHit(); P1.ufoT=rand(20,28)*60; done=true; break; }
      const sh=shieldAt(s.x,s.y); if(sh){ erode(sh,s.x,s.y-2,'shotBoom'); done=true; break; }
      for(let i=0;i<P1.bombs.length;i++){ const b=P1.bombs[i]; if(Math.abs(b.x-s.x)<=1&&s.y>=b.y&&s.y<=b.y+7){ P1.bombs.splice(i,1); if(Math.random()<.7) done=true; P1.booms.push({x:s.x-4,y:s.y-3,k:'shotBoom',t:10}); break; } }
      if(s.y<32){ P1.shotBoom={x:s.x-4,y:32,t:16}; done=true; }
    }
    if(done) P1.shot=null;
  }
  if(P1.shotBoom&&--P1.shotBoom.t<=0) P1.shotBoom=null;
  if(P1.alive<=0){ P1.state='clear'; ufoSound(false); return; }
  if(!pl.alive&&!P1.storm){ P1.booms=P1.booms.filter(b=>--b.t>0); return; }
  // --- invaders: the ripple (one invader per tick, three during the storm) ---
  if(P1.freeze>0&&!P1.storm) P1.freeze--;
  else for(let rr=0;rr<(P1.storm?3:1);rr++){
    const n=P1.order.length; let guard=0;
    while(!P1.order[P1.ri].alive&&guard++<n){ P1.ri++; if(P1.ri>=n){P1.ri=0; p1SweepDone();} }
    const iv=P1.order[P1.ri];
    if(iv.alive){
      if(P1.dropping) iv.y+=8; else iv.x+=P1.dir*(P1.alive===1&&P1.dir>0?3:2);
      iv.f^=1;
      for(const s of P1.shields){ // invaders crush the bunkers
        if(iv.y+8>s.y&&iv.y<s.y+16&&iv.x+iv.w>s.x&&iv.x<s.x+22){
          for(let y=0;y<8;y++) for(let x=0;x<iv.w;x++){ const lx=iv.x+x-s.x, ly=iv.y+y-s.y; if(lx>=0&&lx<22&&ly>=0&&ly<16) s.b[ly*22+lx]=0; }
          s.dirty=true; }
      }
      if(iv.y+8>=216){ P1.lives=0; p1KillPlayer(); P1.lives=0; }
    }
    P1.ri++; if(P1.ri>=n){P1.ri=0; p1SweepDone();}
  }
  // --- heartbeat ---
  P1.noteT-=1/60;
  if(P1.noteT<=0){ SFX.march(P1.noteI++); P1.noteT=clamp(P1.alive/62,.1,.85); }
  // --- bombs ---
  if(P1.storm&&P1.bombs.length<140){ // the bullet storm: no escape
    const cols={}; for(const iv of P1.inv) if(iv.alive&&(!cols[iv.c]||iv.y>cols[iv.c].y)) cols[iv.c]=iv;
    const list=Object.values(cols); if(list.length){ const s=pick(list); P1.bombs.push({x:s.x+Math.floor(s.w/2),y:s.y+8,ty:irand(0,2),f:0}); }
    const sp=P1.stormT<1?40:Math.max(8,40-P1.stormT*14);
    P1.bombs.push({x:Math.round(clamp(pl.x+6+rand(-sp,sp),4,220)),y:rand(34,60),ty:irand(0,2),f:0});
    if(P1.stormT>1.2) P1.bombs.push({x:Math.round(pl.x+6+rand(-6,6)),y:150,ty:irand(0,2),f:0});
    P1.stormT+=1/60;
  }
  else if(--P1.bombT<=0&&P1.bombs.length<3){
    const cols={}; for(const iv of P1.inv) if(iv.alive&&(!cols[iv.c]||iv.y>cols[iv.c].y)) cols[iv.c]=iv;
    const list=Object.values(cols);
    let src=null;
    if(Math.random()<.4) src=list.find(iv=>pl.x+6>=iv.x-2&&pl.x+6<=iv.x+iv.w+2);
    if(!src) src=pick(list);
    if(src) P1.bombs.push({x:src.x+Math.floor(src.w/2),y:src.y+8,ty:irand(0,2),f:0});
    P1.bombT=P1.alive>20?irand(28,55):irand(16,34);
  }
  const bs=P1.storm?2.8:P1.alive<=8?2.1:1.4;
  for(let i=P1.bombs.length-1;i>=0;i--){
    const b=P1.bombs[i]; b.y+=bs; if(P1.tick%4===0) b.f=(b.f+1)%4;
    let gone=false;
    const sh=shieldAt(b.x,b.y+7)||shieldAt(b.x+1,b.y+7);
    if(sh){ erode(sh,b.x,b.y+8,'shotBoom'); gone=true; }
    else if(pl.alive&&b.x>=pl.x&&b.x<=pl.x+12&&b.y+7>=216&&b.y<224){ p1KillPlayer(); gone=true; }
    else if(b.y+7>=232){ P1.booms.push({x:b.x-4,y:226,k:'shotBoom',t:12}); gone=true; }
    if(gone) P1.bombs.splice(i,1);
  }
  // --- saucer ---
  if(!P1.ufo&&--P1.ufoT<=0&&P1.alive>=8){ const d=P1.shots%2?1:-1; P1.ufo={x:d>0?-16:224,d}; ufoSound(true); }
  if(P1.ufo){ P1.ufo.x+=P1.ufo.d*.8; if(P1.ufo.x<-18||P1.ufo.x>226){ P1.ufo=null; ufoSound(false); P1.ufoT=rand(20,28)*60; } }
  if(P1.ufoMsg&&--P1.ufoMsg.t<=0) P1.ufoMsg=null;
  P1.booms=P1.booms.filter(b=>--b.t>0);
  if(!P1.extra&&score>=1500){ P1.extra=true; P1.lives++; SFX.power(); }
}

    $('ps').textContent='The mothership is space dust. 1978 is proud of you.';
    $('b1').textContent='LOOP ×'+(speedMul*2); $('b2').textContent='FROM 1978'; }
  else{ $('pk').textContent='PHASE '+phase+' · '+NAMES[phase]; $('pt').textContent=phase===1?'GAME OVER':'DESTROYED.';
    $('ps').textContent=LINES[deathCause]||'Gone.';
    $('b1').textContent=phase===1?'INSERT COIN':'RETRY PHASE '+phase; $('b2').textContent='FROM 1978'; }
  $('b2').style.display=(!win&&phase===1)?'none':'';
  $('pstats').innerHTML=`<div>SCORE<b>${pad(score)}</b></div><div>HI<b>${pad(HI)}</b></div>`;
  p.dataset.win=win?1:0;
}
function victory(){ mode='win'; setTrack('win'); banner('YOU SAVED','1978','#ffd84a'); later(()=>showPanel(true),2600); }
$('b1').onclick=()=>{ initAudio(); const p=$('panel'); p.classList.remove('on');
  if(p.dataset.win==='1'){ speedMul*=2; startGame(); return; }
  if(phase===1) startGame(); else jumpTo(phase,true); };
$('b2').onclick=()=>{ initAudio(); speedMul=1; startGame(); };
function jumpTo(n,retry){
  gen++;
  $('panel').classList.remove('on'); $('warn').style.display='none'; FX.uniforms.uTint.value.set(1,1,1);
  if(retry) score=phaseScore; else if(n>1&&score===0) score=0;
  show3D(true); DEB.length=0; SPK.length=0; BOLTS.length=0; ORBS.length=0; $('bossbar').style.display='none'; beams.forEach(b=>b.visible=false); coreLight.intensity=0;
  ufoSound(false); timeScale=1; slowT=0; fx.glitch=.5; flash(.6);
  if(!P1.shields) p1NewGame();
  if(n===2){
    P1.shields.forEach((s,i)=>{ s.b=shieldSnap?shieldSnap[i].slice():shieldBitmap(); s.dirty=true; });
    shieldH=1; shieldDirty=true; G_DEB={g:-24,floor:true,drift:0}; scene.fog.density=.004;
    envSet({grid:1,sun:1,mtn:1,stars:1,neb:0,streak:0,tun:0,twist:0,speed:3});
    P2.pl={x:0,vx:0,inv:0,cd:0,power:null,pt:0,rx:0}; p2Setup(); setPhase(2); mode='p2'; setTrack('synth');
    banner('PHASE 2 / 4',NAMES[2],GLOW[2]); $('od').style.display='none';
  } else {
    P1.shields.forEach(s=>{ s.b.fill(0); s.dirty=true; }); shieldDirty=true; G_DEB={g:0,floor:false,drift:30}; scene.fog.density=.0;
    spReset(false); SP.od=retry?SP.od:0; $('od').style.display='block';
    if(n===3){ envSet({grid:0,sun:0,mtn:0,stars:.5,neb:1,streak:1,tun:.9,twist:0,speed:70});
      ENV.neb.material.uniforms.uC1.value.set(.5,0,.8); ENV.neb.material.uniforms.uC2.value.set(0,.45,.85);
      p3Setup(); setPhase(3); mode='p3'; novaFn=novaBlast3; setTrack('hyper'); banner('PHASE 3 / 4',NAMES[3],GLOW[3]); }
    else { envSet({grid:0,sun:0,mtn:0,stars:.5,neb:.6,streak:.4,tun:0,twist:0,speed:25});
      ENV.neb.material.uniforms.uC1.value.set(.6,0,.14); ENV.neb.material.uniforms.uC2.value.set(.25,0,.5);
      p3Setup(); setPhase(4); bossSetup(); mode='p4'; novaFn=bossNova; TRACKS.boss.bpm=152; setTrack('boss'); banner('PHASE 4 / 4 · FINAL',NAMES[4],GLOW[4]); }
  }
  phaseScore=score;
}
// ---------- keys / secret level select ----------
let typed='';
onAnyKey=e=>{
  initAudio();
  if(e.code==='KeyM'){ setMute(!muted); return; }
  if(/^Digit[2-4]$/.test(e.code)||/^Numpad[2-4]$/.test(e.code)){ typed=(typed+e.code.slice(-1)).slice(-3); if(/^(222|333|444)$/.test(typed)){ const n=+typed[0]; typed=''; if(mode==='title') score=0; jumpTo(n); } }
  if(mode==='title'&&(e.code==='Space'||e.code==='Enter'||e.pointer)){ startGame(); return; }
  if((e.code==='Space'||e.code==='Enter')&&$('panel').classList.contains('on')){ $('b1').click(); }
};
let scoreTaps=0, scoreTapT=null;
$('score').addEventListener('pointerdown',e=>{ e.stopPropagation(); scoreTaps++; clearTimeout(scoreTapT); scoreTapT=setTimeout(()=>{ if(scoreTaps>=2&&scoreTaps<=4) jumpTo(scoreTaps); scoreTaps=0; },650); });
$('novaBtn').addEventListener('pointerdown',e=>{ e.stopPropagation(); if(SP.od>=1&&(mode==='p3'||mode==='p4')) nova(); });
// ---------- HUD ----------
function hud(){
  $('scTxt').textContent=pad(score); $('hiTxt').textContent='HI '+pad(HI);
  let lives=0, bar=0;
  if(mode==='p2'||mode==='reveal'){ lives=P2.lives; bar=P2.total?(1-P2.alive/P2.total):0; }
  else if(mode==='p3'||mode==='morph'){ lives=SP.lives; bar=P3.t/P3_DUR; }
  else if(mode==='p4'||mode==='warn'||mode==='win'){ lives=SP.lives; bar=B.hp!=null?1-B.hp:1; }
  else if(mode==='dead'){ lives=0; bar=-1; }
  if(bar>=0) $('phBar').style.width=(clamp(bar,0,1)*100).toFixed(1)+'%';
  $('lives').textContent='♥'.repeat(Math.max(0,lives));
  $('odBar').style.width=(SP.od*100)+'%'; $('od').classList.toggle('full',SP.od>=1);
  $('novaBtn').style.display=TOUCH&&SP.od>=1&&(mode==='p3'||mode==='p4')?'block':'none';
}
// ---------- main loop ----------
let last=performance.now();
function render3D(dt,rdt){
  envUpdate(dt,T);
  if(shieldDirty) shieldRebuild();
  debUpdate(dt); spkUpdate(dt); ringUpdate(dt); projDraw(T); popUpdate(rdt);
  // shake
  fx.shake=Math.max(0,fx.shake-rdt*2.2);
  const sh=fx.shake*fx.shake*.6; camera.position.x+=rand(-1,1)*sh; camera.position.y+=rand(-1,1)*sh;
  fx.ca=Math.max(0,fx.ca-rdt*.12); fx.glitch=Math.max(0,fx.glitch-rdt*.9);
  FX.uniforms.uCA.value=.004+fx.ca; FX.uniforms.uGlitch.value=fx.glitch; FX.uniforms.uTime.value=T;
  composer.render();
}
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(now-last)/1000); last=now;
  readInput(); musicTick();
  const nv=inp.nova; novaEdge=nv&&!novaLatch; novaLatch=nv;
  if(slowT>0){ slowT-=rdt; timeScale=lerp(timeScale,slowTarget,1-Math.exp(-rdt*12)); } else timeScale=lerp(timeScale,1,1-Math.exp(-rdt*4));
  const dt=rdt*timeScale*(mode==='p1'?1:1); T+=dt;
  fx.flash=Math.max(0,fx.flash-rdt*2.5); $('flash').style.opacity=fx.flash;
  switch(mode){
    case 'title': p1Frame(rdt); break;
    case 'p1': p1Frame(rdt*speedMul); if(P1.state==='clear') startReveal(); else if(P1.state==='over'&&P1.overT>110&&!P1.paneled){ P1.paneled=true; deathCause='p1'; mode='p1over'; showPanel(false); } break;
    case 'p1over': p1Frame(rdt); break;
    case 'reveal': revealUpdate(rdt); if(REV.stage>=1){ revealDraw(); revealCamera(); render3D(dt,rdt); } break;
    case 'p2': p2Update(dt,T); p2Draw(T); p2Camera(T); if(P2.alive<=0&&mode==='p2') startMorph(); render3D(dt,rdt); break;
    case 'morph': morphUpdate(dt); moveBolts(dt); morphDraw(); morphCamera(T); render3D(dt,rdt); break;
    case 'p3': p3Update(dt,T); p3Draw(T); spCamera(T); render3D(dt,rdt); break;
    case 'warn': warnUpdate(dt,T); p3Draw(T); spCamera(T); render3D(dt,rdt); break;
    case 'p4': p4Update(dt,T); bossDraw(T); spCamera(T); render3D(dt,rdt); break;
    case 'win': spUpdate(dt,false); moveBolts(dt); if(B.cells) bossUpdate(dt,T); bossDraw(T); spCamera(T); render3D(dt,rdt); break;
    case 'dead':
      if(phase===2){ p2Draw(T); p2Camera(T); } else if(phase===4){ bossDraw(T); spCamera(T); } else { p3Draw(T); spCamera(T); }
      moveOrbs(0); render3D(dt,rdt); break;
  }
  hud();
}
function onResize(){ p1Layout(); resize3(); }
addEventListener('resize',onResize); onResize();
document.fonts&&document.fonts.load('8px "Press Start 2P"').then(()=>{}).catch(()=>{});
requestAnimationFrame(frame);
window.__game={get mode(){return mode},get phase(){return phase},jumpTo,startGame,startReveal,P1,P2,P3,B,SP,get score(){return score},
  killAllP1(){ for(const iv of P1.inv) if(iv.alive){iv.alive=false;P1.alive--;} },
  killAllP2(){ for(const iv of P2.inv) if(iv.alive){ iv.alive=false; P2.alive--; } },
  set god(x){ GOD=x; }, endP3(){ P3.t=P3_DUR; }, bossHp(x){ B.hp=x; }, od(){ SP.od=1; } };
</script>
